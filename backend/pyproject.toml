[project]
name = "spatialviz-backend"
version = "0.1.0"
description = "SpatialViz Studio — 2D floor plan to 3D spatial intelligence backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "azure-identity>=1.19.0",
    "pydantic>=2.10.0",
    "pillow>=11.0.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.9.0",
]
